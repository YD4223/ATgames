<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏资源站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 40px 0; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(90deg, #00d4ff, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .nav a { color: #888; text-decoration: none; padding: 10px 20px; border-radius: 8px; transition: all 0.3s; cursor: pointer; }
        .nav a:hover, .nav a.active { background: rgba(255,255,255,0.1); color: #fff; }
        
        .search-box { max-width: 600px; margin: 0 auto 30px; }
        #search { width: 100%; padding: 15px 20px; font-size: 16px; border: none; border-radius: 50px; background: rgba(255,255,255,0.1); color: #fff; outline: none; }
        #search:focus { background: rgba(255,255,255,0.15); box-shadow: 0 0 20px rgba(0,212,255,0.3); }
        
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .game-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.05); }
        .game-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); border-color: rgba(0,212,255,0.3); }
        .game-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; }
        .game-date { font-size: 0.8rem; color: #666; margin-bottom: 15px; }
        .game-link { display: inline-block; padding: 10px 20px; background: linear-gradient(90deg, #00d4ff, #7c3aed); color: #fff; text-decoration: none; border-radius: 8px; }
        
        .no-result { text-align: center; padding: 60px; color: #666; }
        
        .admin-panel { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(90deg, #00d4ff, #7c3aed); color: #fff; }
        .btn-danger { background: #ff4757; color: #fff; }
        .btn-success { background: #2ed573; color: #fff; }
        .btn:hover { transform: scale(1.05); }
        
        .game-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 10px; }
        .game-item-info { flex: 1; }
        .game-item-title { font-weight: 600; }
        .game-item-date { font-size: 0.8rem; color: #666; }
        .game-item-actions { display: flex; gap: 10px; }
        
        .hidden { display: none; }
        .export-box { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); border-radius: 12px; padding: 20px; margin-top: 30px; }
        .export-box h3 { margin-bottom: 15px; color: #00d4ff; }
        .export-box p { color: #aaa; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 游戏资源站</h1>
            <p class="subtitle">每日更新 · 全部免费</p>
        </header>
        
        <nav class="nav">
            <a class="active" onclick="showPage('home')">首页</a>
            <a onclick="showPage('admin')">管理后台</a>
        </nav>
        
        <!-- 首页 -->
        <div id="home-page">
            <div class="search-box">
                <input type="text" id="search" placeholder="搜索游戏名称...">
            </div>
            <p style="text-align:center;color:#666;margin-bottom:20px" id="stats">共 0 个游戏</p>
            <div class="game-grid" id="gameGrid"></div>
            <div class="no-result" id="noResult" style="display:none">没有找到匹配的游戏</div>
        </div>
        
        <!-- 管理后台 -->
        <div id="admin-page" class="hidden">
            <div class="admin-panel">
                <h2>➕ 添加游戏</h2>
                <div class="form-group">
                    <label>游戏名称</label>
                    <input type="text" id="gameName" placeholder="例如：黑神话：悟空">
                </div>
                <div class="form-group">
                    <label>下载链接</label>
                    <input type="text" id="gameUrl" placeholder="百度网盘链接">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="gameCategory">
                        <option value="action">动作</option>
                        <option value="rpg">RPG</option>
                        <option value="strategy">策略</option>
                        <option value="simulation">模拟</option>
                        <option value="casual">休闲</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="addGame()">添加游戏</button>
                
                <h2 style="margin-top:40px">📋 游戏列表</h2>
                <div class="game-list" id="gameList"></div>
                
                <div class="export-box">
                    <h3>📤 导出并发布</h3>
                    <p>添加/删除游戏后，点击下方按钮下载 games.json，然后上传到 GitHub 仓库替换旧文件，别人就能看到更新了！</p>
                    <button class="btn btn-success" onclick="exportData()">下载 games.json</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let games = [];
        let currentFilter = 'all';
        let searchTerm = '';
        
        // 从 games.json 加载数据
        async function loadGames() {
            try {
                const response = await fetch('games.json');
                games = await response.json();
            } catch (e) {
                games = [];
            }
            renderGames();
            renderGameList();
        }
        
        function renderGames() {
            const grid = document.getElementById('gameGrid');
            const noResult = document.getElementById('noResult');
            const stats = document.getElementById('stats');
            
            let filtered = games.filter(game => {
                return game.title.toLowerCase().includes(searchTerm.toLowerCase()) 
                    && (currentFilter === 'all' || game.category === currentFilter);
            });
            
            stats.textContent = `共 ${filtered.length} 个游戏`;
            
            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResult.style.display = 'block';
                return;
            }
            
            noResult.style.display = 'none';
            grid.innerHTML = filtered.map(game => `
                <div class="game-card">
                    <h3 class="game-title">${game.title}</h3>
                    <p class="game-date">📅 ${game.date} · ${getCategoryName(game.category)}</p>
                    <a href="${game.url}" target="_blank" class="game-link">下载</a>
                </div>
            `).join('');
        }
        
        function renderGameList() {
            const list = document.getElementById('gameList');
            list.innerHTML = games.map(game => `
                <div class="game-item">
                    <div class="game-item-info">
                        <div class="game-item-title">${game.title}</div>
                        <div class="game-item-date">${game.date} · ${getCategoryName(game.category)}</div>
                    </div>
                    <div class="game-item-actions">
                        <button class="btn btn-danger" onclick="deleteGame('${game.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        function getCategoryName(cat) {
            const names = {action: '动作', rpg: 'RPG', strategy: '策略', simulation: '模拟', casual: '休闲'};
            return names[cat] || cat;
        }
        
        function addGame() {
            const title = document.getElementById('gameName').value;
            const url = document.getElementById('gameUrl').value;
            const category = document.getElementById('gameCategory').value;
            
            if (!title || !url) {
                alert('请填写游戏名称和下载链接');
                return;
            }
            
            const game = {
                id: Date.now().toString(),
                title,
                url,
                category,
                date: new Date().toISOString().split('T')[0]
            };
            
            games.unshift(game);
            
            // 清空表单
            document.getElementById('gameName').value = '';
            document.getElementById('gameUrl').value = '';
            
            alert('添加成功！记得点击下方"下载 games.json" 保存数据！');
            renderGameList();
        }
        
        function deleteGame(id) {
            if (confirm('确定删除这个游戏？')) {
                games = games.filter(g => g.id !== id);
                alert('删除成功！记得点击下方"下载 games.json" 保存数据！');
                renderGameList();
            }
        }
        
        function exportData() {
            const data = JSON.stringify(games, null, 2);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'games.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function showPage(page) {
            document.getElementById('home-page').classList.toggle('hidden', page !== 'home');
            document.getElementById('admin-page').classList.toggle('hidden', page !== 'admin');
            document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        document.getElementById('search').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderGames();
        });
        
        loadGames();
    </script>
</body>
</html>
