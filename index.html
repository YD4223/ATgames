<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATgame资源站</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🎮</text></svg>" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 动态背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            color: #fff;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e, #16213e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 星空粒子效果 */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
        
        /* 公告栏 */
        .announcement {
            background: linear-gradient(90deg, rgba(255,107,53,0.2), rgba(247,197,159,0.2));
            border: 1px solid rgba(255,107,53,0.4);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); }
            50% { box-shadow: 0 0 20px 5px rgba(255,107,53,0.2); }
        }
        .announcement-icon { font-size: 1.2rem; }
        .announcement-text { flex: 1; font-size: 0.9rem; color: #ffaa7f; }
        .announcement-close {
            background: none; border: none; color: #ffaa7f;
            cursor: pointer; font-size: 1.2rem; opacity: 0.7;
        }
        .announcement-close:hover { opacity: 1; }

        header { text-align: center; padding: 30px 0 20px; }
        h1 {
            font-size: 2.8rem; margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed, #ff6b6b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; letter-spacing: 2px; }

        /* 今日更新横幅 */
        .today-banner {
            background: linear-gradient(90deg, rgba(0,212,255,0.15), rgba(124,58,237,0.15));
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .today-banner-top {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .today-banner .badge {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .today-banner .today-count { color: #00d4ff; font-weight: 600; font-size: 0.95rem; }
        .today-banner .today-list { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
        .today-tag {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #ddd;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .today-tag:hover {
            background: rgba(0,212,255,0.2);
            border-color: #00d4ff;
            color: #00d4ff;
            transform: translateY(-2px);
        }
        .today-tag.today-more {
            background: rgba(255,107,53,0.15);
            border-color: rgba(255,107,53,0.4);
            color: #ffaa7f;
            cursor: pointer;
        }
        .today-tag.today-more:hover {
            background: rgba(255,107,53,0.3);
            border-color: #ff6b35;
            color: #ff6b35;
        }

        /* 搜索框 */
        .search-box { max-width: 600px; margin: 0 auto 20px; position: relative; }
        #search {
            width: 100%; padding: 15px 50px 15px 20px;
            font-size: 16px; border: none; border-radius: 50px;
            background: rgba(255,255,255,0.1);
            color: #fff; outline: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #search:focus { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.2); }
        #search::placeholder { color: #666; }
        .search-clear {
            position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%);
            cursor: pointer; color: #666;
            font-size: 1.2rem;
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        .search-clear:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* 筛选栏 */
        .filter-section { margin-bottom: 16px; }
        .filter-label {
            color: #888; font-size: 0.85rem;
            margin-bottom: 8px; display: block;
        }
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-color: transparent;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.3);
        }
        .filter-btn .count {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 0.75rem;
            margin-left: 4px;
        }

        /* 平台筛选特殊样式 */
        .filter-btn[data-filter="pc"].active {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
        }
        .filter-btn[data-filter="android"].active {
            background: linear-gradient(90deg, #43e97b, #38f9d7);
        }
        .filter-btn[data-filter="today"].active {
            background: linear-gradient(90deg, #ff6b35, #f7c59f);
        }

        /* 排序栏 */
        .sort-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0 10px;
        }
        .stats { color: #888; font-size: 0.9rem; }
        .sort-btns { display: flex; gap: 8px; }
        .sort-btn {
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            color: #888;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
        }
        .sort-btn.active, .sort-btn:hover {
            border-color: #00d4ff;
            color: #00d4ff;
            background: rgba(0,212,255,0.1);
        }

        /* 游戏卡片 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-8px);
            background: rgba(255,255,255,0.1);
            border-color: rgba(0,212,255,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .game-card.today-new {
            border-color: rgba(255,107,53,0.4);
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 5px rgba(255,107,53,0.2); }
            to { box-shadow: 0 0 20px rgba(255,107,53,0.4); }
        }
        .new-badge {
            position: absolute; top: 12px; right: 12px;
            background: linear-gradient(90deg, #ff6b35, #f7c59f);
            color: #fff;
            font-size: 0.7rem; font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            animation: pulse-badge 1.5s infinite;
        }
        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .card-top {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 12px; flex-wrap: wrap;
        }
        .game-tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
            border-radius: 12px;
            font-size: 0.75rem;
        }
        .platform-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .platform-tag.pc {
            background: rgba(79,172,254,0.2);
            color: #4facfe;
        }
        .platform-tag.android {
            background: rgba(67,233,123,0.2);
            color: #43e97b;
        }
        .game-title {
            font-size: 1.1rem; font-weight: 600;
            margin-bottom: 8px; line-height: 1.4;
            color: #fff;
            flex: 1;
        }
        .game-date {
            font-size: 0.78rem;
            color: #888;
            margin-bottom: 15px;
        }
        .card-actions {
            display: flex; gap: 10px; align-items: center;
            margin-top: auto;
        }
        .game-link {
            display: inline-block;
            padding: 10px 24px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            cursor: pointer;
            border: none;
        }
        .game-link:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,212,255,0.3);
        }
        .feedback-btn {
            padding: 10px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #aaa;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .feedback-btn:hover {
            background: rgba(255,107,53,0.2);
            border-color: #ff6b35;
            color: #ffaa7f;
        }

        .no-result {
            text-align: center; padding: 80px 20px;
            color: #666;
        }
        .no-result .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* 下载选择弹窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: linear-gradient(135deg, #1a1a2e, #24243e);
            border-radius: 20px;
            padding: 30px;
            width: 90%; max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal h3 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.3rem;
            text-align: center;
        }
        .modal-game-name {
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
            color: #00d4ff;
            font-weight: 600;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-btn {
            padding: 15px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
        }
        .modal-btn.baidu { background: #4CAF50; }
        .modal-btn.quark { background: #2196F3; }
        .modal-btn.thunder { background: #FF9800; }
        .modal-btn.cancel { background: #666; }
        .modal-btn:hover { transform: scale(1.02); opacity: 0.9; }
        .modal-btn.disabled { opacity: 0.4; cursor: not-allowed; }

        /* 反馈弹窗 */
        .feedback-modal h3 { margin-bottom: 20px; color: #fff; font-size: 1.3rem; }
        .modal-info {
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .modal-info p { color: #888; font-size: 0.8rem; margin-bottom: 5px; }
        .modal-info .game-name { color: #00d4ff; font-size: 0.95rem; font-weight: 600; }
        .modal textarea {
            width: 100%; min-height: 100px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 0.95rem;
            resize: vertical;
            margin-bottom: 15px;
        }
        .modal textarea:focus { outline: none; border-color: #00d4ff; }
        .modal input {
            width: 100%; padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .modal input:focus { outline: none; border-color: #00d4ff; }
        .feedback-buttons { display: flex; gap: 10px; }
        .feedback-btn-submit {
            flex: 1; padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            color: #fff;
        }
        .feedback-btn-cancel {
            flex: 1; padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: rgba(255,255,255,0.1);
            color: #aaa;
        }
        .feedback-btn-submit:hover, .feedback-btn-cancel:hover { transform: scale(1.02); }

        /* 响应式 */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .game-grid { grid-template-columns: 1fr; }
            .filter-bar { gap: 6px; }
            .filter-btn { padding: 6px 12px; font-size: 0.85rem; }
        }

        /* 打赏区域 */
        .donate-section {
            background: linear-gradient(135deg, rgba(255,107,53,0.15), rgba(255,193,7,0.15));
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .donate-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #ffaa7f;
        }
        .donate-desc {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
        }
        .donate-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(90deg, #ff6b35, #ffaa7f);
            color: #fff;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            box-shadow: 0 5px 20px rgba(255,107,53,0.3);
        }
        .donate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255,107,53,0.5);
        }

        /* 打赏弹窗 */
        .donate-modal .modal {
            max-width: 500px;
        }
        .donate-codes {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .donate-code-item {
            text-align: center;
        }
        .donate-code-item img {
            width: 200px;
            height: 280px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            object-fit: contain;
            background: #fff;
        }
        .donate-code-label {
            margin-top: 10px;
            font-size: 1rem;
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <div class="container">
        <!-- 公告栏 -->
        <div class="announcement" id="announcement">
            <span class="announcement-icon">📢</span>
            <span class="announcement-text">🎉 （本网站所有资源免费下载）网站全新升级！点击下载可选择百度/夸克/迅雷网盘！有些网盘密码就在链接上建议：把密码单独复制后删去链接中的密码部分才能正常访问，如有其他问题加qq:508002830(备注来意）！</span>
            <button class="announcement-close" onclick="closeAnnouncement()">✕</button>
        </div>

        <!-- 打赏区域 -->
        <div class="donate-section">
            <div class="donate-title">☕ 支持一下</div>
            <div class="donate-desc">您的支持是我更新最大的动力</div>
            <button class="donate-btn" onclick="openDonateModal()">❤️ 打赏</button>
        </div>

        <header>
            <h1>🎮 ATgame资源站</h1>
            <p class="subtitle">每日更新 · 全部免费</p>
        </header>

        <!-- 今日更新横幅 -->
        <div class="today-banner" id="todayBanner" style="display:none">
            <div class="today-banner-top">
                <span class="badge">🔥 今日更新</span>
                <span class="today-count" id="todayCount"></span>
            </div>
            <div class="today-list" id="todayList"></div>
        </div>

        <!-- 搜索框 -->
        <div class="search-box">
            <input type="text" id="search" placeholder="🔍 搜索游戏名称...">
            <span class="search-clear" id="searchClear" style="display:none">✕</span>
        </div>

        <!-- 平台筛选 -->
        <div class="filter-section">
            <span class="filter-label">🖥️ 平台</span>
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all" data-type="platform">全部</button>
                <button class="filter-btn" data-filter="pc" data-type="platform">🖥️ 电脑</button>
                <button class="filter-btn" data-filter="android" data-type="platform">📱 安卓</button>
            </div>
        </div>

        <!-- 分类筛选 -->
        <div class="filter-section">
            <span class="filter-label">🎮 类型</span>
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all" data-type="category">全部 <span class="count" id="count-all">0</span></button>
                <button class="filter-btn" data-filter="today" data-type="category">🔥 今日更新 <span class="count" id="count-today">0</span></button>
                <button class="filter-btn" data-filter="action" data-type="category">动作 <span class="count" id="count-action">0</span></button>
                <button class="filter-btn" data-filter="rpg" data-type="category">RPG <span class="count" id="count-rpg">0</span></button>
                <button class="filter-btn" data-filter="strategy" data-type="category">策略 <span class="count" id="count-strategy">0</span></button>
                <button class="filter-btn" data-filter="simulation" data-type="category">模拟 <span class="count" id="count-simulation">0</span></button>
                <button class="filter-btn" data-filter="casual" data-type="category">休闲 <span class="count" id="count-casual">0</span></button>
                <button class="filter-btn" data-filter="software" data-type="category">软件 <span class="count" id="count-software">0</span></button>
            </div>
        </div>

        <!-- 排序栏 -->
        <div class="sort-bar">
            <span class="stats" id="stats">共 0 个游戏</span>
            <div class="sort-btns">
                <button class="sort-btn active" data-sort="date">📅 最新优先</button>
                <button class="sort-btn" data-sort="title">🔤 按名称</button>
            </div>
        </div>

        <!-- 游戏列表 -->
        <div class="game-grid" id="gameGrid"></div>
        <div class="no-result" id="noResult" style="display:none">
            <div class="icon">🎮</div>
            <p>没有找到匹配的游戏</p>
        </div>
    </div>

    <!-- 打赏弹窗 -->
    <div class="modal-overlay donate-modal" id="donateModal">
        <div class="modal">
            <h3>☕ 支持一下</h3>
            <div class="donate-desc" style="text-align:center;margin-bottom:20px">您的支持是我更新最大的动力</div>
            <div class="donate-codes">
                <div class="donate-code-item">
                    <img src="wechat.png" alt="微信收款码" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22280%22><rect fill=%22%23f5f5f5%22 width=%22200%22 height=%22280%22/><text x=%2250%22 y=%22150%22 font-size=%2214%22 fill=%22%23999%22>微信收款码</text></svg>'">
                    <div class="donate-code-label">💚 微信</div>
                </div>
                <div class="donate-code-item">
                    <img src="alipay.png" alt="支付宝收款码" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22280%22><rect fill=%22%23f5f5f5%22 width=%22200%22 height=%22280%22/><text x=%2250%22 y=%22150%22 font-size=%2214%22 fill=%22%23999%22>支付宝收款码</text></svg>'">
                    <div class="donate-code-label">💙 支付宝</div>
                </div>
            </div>
            <div style="text-align:center;margin-top:20px">
                <button class="modal-btn cancel" onclick="closeDonateModal()" style="width:100%">关闭</button>
            </div>
        </div>
    </div>

    <!-- 下载选择弹窗 -->
    <div class="modal-overlay" id="downloadModal">
        <div class="modal">
            <h3>📥 选择下载方式</h3>
            <div class="modal-game-name" id="downloadGameName"></div>
            <div class="modal-buttons">
                <button class="modal-btn baidu" id="btnBaidu" onclick="confirmDownload('baidu')">
                    📁 百度网盘
                </button>
                <button class="modal-btn quark" id="btnQuark" onclick="confirmDownload('quark')">
                    📁 夸克网盘
                </button>
                <button class="modal-btn thunder" id="btnThunder" onclick="confirmDownload('thunder')">
                    📁 迅雷网盘
                </button>
                <button class="modal-btn cancel" onclick="closeDownloadModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 反馈弹窗 -->
    <div class="modal-overlay feedback-modal" id="feedbackModal">
        <div class="modal">
            <h3>💬 反馈问题</h3>
            <div class="modal-info">
                <p>游戏名称</p>
                <p class="game-name" id="feedbackGame"></p>
            </div>
            <textarea id="feedbackContent" placeholder="请描述问题（如：链接失效、下载不了、密码错误等）..."></textarea>
            <input type="text" id="feedbackContact" placeholder="qq:508002830">
            <div class="feedback-buttons">
                <button class="feedback-btn-cancel" onclick="closeFeedback()">取消</button>
                <button class="feedback-btn-submit" onclick="submitFeedback()">📧 发送邮件</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 配置区域 =====
        const CONFIG = {
            // 接收反馈的邮箱地址
            feedbackEmail: 'qq:508002830',
            // 网站名称
            siteName: 'ATgame资源站',
            // 收款码图片链接（上传到GitHub后修改这里）
            wechatQR: 'wechat.png',
            alipayQR: 'alipay.png'
        };
        // =====================

        let games = [];
        let currentPlatform = 'all';
        let currentCategory = 'all';
        let currentSort = 'date';
        let searchTerm = '';
        let currentFeedbackGame = '';
        let currentDownloadGame = null;

        const categoryNames = {
            action: '动作', rpg: 'RPG', strategy: '策略',
            simulation: '模拟', casual: '休闲', software: '软件'
        };
        const platformNames = {
            pc: '🖥️ 电脑', android: '📱 安卓'
        };

        // 生成星空背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.opacity = Math.random();
                starsContainer.appendChild(star);
            }
        }

        // 获取今天日期
        function getTodayStr() {
            const d = new Date();
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        function isToday(dateStr) {
            if (!dateStr) return false;
            return dateStr.startsWith(getTodayStr());
        }

        async function loadGames() {
            try {
                const response = await fetch('games.json');
                games = await response.json();
            } catch (e) { games = []; }
            updateCounts();
            renderTodayBanner();
            renderGames();
        }

        // 更新数量统计
        function updateCounts() {
            document.getElementById('count-all').textContent = games.length;
            document.getElementById('count-today').textContent = games.filter(g => isToday(g.date)).length;
            
            ['action', 'rpg', 'strategy', 'simulation', 'casual', 'software'].forEach(cat => {
                const el = document.getElementById('count-' + cat);
                if (el) el.textContent = games.filter(g => g.category === cat).length;
            });
        }

        // 渲染今日更新横幅
        function renderTodayBanner() {
            const todayGames = games.filter(g => isToday(g.date));
            const banner = document.getElementById('todayBanner');
            
            if (todayGames.length === 0) {
                banner.style.display = 'none';
                return;
            }

            banner.style.display = 'flex';
            document.getElementById('todayCount').textContent = `今天新增 ${todayGames.length} 个`;
            
            const maxShow = 4;
            const visible = todayGames.slice(0, maxShow);
            const rest = todayGames.length - maxShow;
            
            let html = visible.map(g => 
                `<span class="today-tag" onclick="scrollToGame('${g.title.replace(/'/g, "\\'")}')">${g.title}</span>`
            ).join('');
            
            if (rest > 0) {
                html += `<span class="today-tag today-more" onclick="toggleMoreGames(this)" data-games='${JSON.stringify(todayGames.slice(maxShow).map(g=>g.title))}'>+${rest} 更多 ▼</span>`;
            }
            
            document.getElementById('todayList').innerHTML = html;
        }

        function toggleMoreGames(el) {
            const titles = JSON.parse(el.dataset.games);
            const list = el.parentElement;
            
            if (el.classList.contains('expanded')) {
                // 收起
                const extras = list.querySelectorAll('.today-tag-extra');
                extras.forEach(e => e.remove());
                el.textContent = `+${titles.length} 更多 ▼`;
                el.classList.remove('expanded');
            } else {
                // 展开
                titles.forEach(title => {
                    const span = document.createElement('span');
                    span.className = 'today-tag today-tag-extra';
                    span.textContent = title;
                    span.onclick = () => scrollToGame(title);
                    list.insertBefore(span, el);
                });
                el.textContent = '收起 ▲';
                el.classList.add('expanded');
            }
        }

        function scrollToGame(title) {
            const cards = document.querySelectorAll('.game-card');
            for (const card of cards) {
                if (card.querySelector('.game-title')?.textContent === title) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    card.style.boxShadow = '0 0 30px rgba(0,212,255,0.6)';
                    setTimeout(() => card.style.boxShadow = '', 2000);
                    break;
                }
            }
        }

        // 渲染游戏列表
        function renderGames() {
            const grid = document.getElementById('gameGrid');
            const noResult = document.getElementById('noResult');
            const stats = document.getElementById('stats');

            let filtered = games.filter(g => {
                const matchSearch = g.title.toLowerCase().includes(searchTerm.toLowerCase());
                const matchPlatform = currentPlatform === 'all' || g.platform === currentPlatform;
                const matchCategory = currentCategory === 'all' ? true
                    : currentCategory === 'today' ? isToday(g.date)
                    : g.category === currentCategory;
                return matchSearch && matchPlatform && matchCategory;
            });

            // 排序
            if (currentSort === 'date') {
                filtered.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            } else {
                filtered.sort((a, b) => a.title.localeCompare(b.title, 'zh'));
            }

            stats.textContent = `共 ${filtered.length} 个游戏`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResult.style.display = 'block';
                return;
            }

            noResult.style.display = 'none';
            grid.innerHTML = filtered.map(g => {
                const todayNew = isToday(g.date);
                return `
                <div class="game-card ${todayNew ? 'today-new' : ''}">
                    ${todayNew ? '<span class="new-badge">NEW</span>' : ''}
                    <div class="card-top">
                        <span class="game-tag">${categoryNames[g.category] || g.category || '其他'}</span>
                        <span class="platform-tag ${g.platform || 'pc'}">${platformNames[g.platform] || '🖥️ 电脑'}</span>
                    </div>
                    <h3 class="game-title">${g.title}</h3>
                    <p class="game-date">📅 ${g.date || '未知日期'}</p>
                    <div class="card-actions">
                        <button class="game-link" onclick="openDownloadModal(${games.indexOf(g)})">⬇️ 下载</button>
                        <button class="feedback-btn" onclick="openFeedback('${g.title}')">💬 反馈</button>
                    </div>
                </div>`;
            }).join('');
        }

        // 搜索
        const searchInput = document.getElementById('search');
        const searchClear = document.getElementById('searchClear');
        searchInput.addEventListener('input', e => {
            searchTerm = e.target.value;
            searchClear.style.display = searchTerm ? 'flex' : 'none';
            renderGames();
        });
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchTerm = '';
            searchClear.style.display = 'none';
            renderGames();
        });

        // 筛选按钮事件
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                const filter = btn.dataset.filter;
                
                document.querySelectorAll(`.filter-btn[data-type="${type}"]`).forEach(b => {
                    b.classList.remove('active');
                });
                btn.classList.add('active');
                
                if (type === 'platform') {
                    currentPlatform = filter;
                } else {
                    currentCategory = filter;
                }
                
                renderGames();
            });
        });

        // 排序
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                renderGames();
            });
        });

        // 公告栏
        function closeAnnouncement() {
            document.getElementById('announcement').style.display = 'none';
            localStorage.setItem('announcementClosed', 'true');
        }
        
        if (localStorage.getItem('announcementClosed') === 'true') {
            document.getElementById('announcement').style.display = 'none';
        }

        // ===== 下载功能 =====
        function openDownloadModal(gameIndex) {
            currentDownloadGame = games[gameIndex];
            if (!currentDownloadGame) return;

            document.getElementById('downloadGameName').textContent = currentDownloadGame.title;
            
            // 检查哪些网盘有链接
            const hasBaidu = currentDownloadGame.baiduUrl || currentDownloadGame.url;
            const hasQuark = currentDownloadGame.quarkUrl;
            const hasThunder = currentDownloadGame.thunderUrl;

            // 更新按钮状态
            document.getElementById('btnBaidu').classList.toggle('disabled', !hasBaidu);
            document.getElementById('btnQuark').classList.toggle('disabled', !hasQuark);
            document.getElementById('btnThunder').classList.toggle('disabled', !hasThunder);

            document.getElementById('downloadModal').classList.add('active');
        }

        function confirmDownload(platform) {
            if (!currentDownloadGame) return;

            let url = '';
            switch(platform) {
                case 'baidu':
                    url = currentDownloadGame.baiduUrl || currentDownloadGame.url; // 兼容旧的 url 字段
                    break;
                case 'quark':
                    url = currentDownloadGame.quarkUrl;
                    break;
                case 'thunder':
                    url = currentDownloadGame.thunderUrl;
                    break;
            }

            if (!url) {
                alert('该网盘暂无链接，请选择其他方式');
                return;
            }

            window.open(url, '_blank');
            closeDownloadModal();
        }

        function closeDownloadModal() {
            document.getElementById('downloadModal').classList.remove('active');
            currentDownloadGame = null;
        }

        // 点击弹窗外部关闭下载弹窗
        document.getElementById('downloadModal').addEventListener('click', (e) => {
            if (e.target.id === 'downloadModal') closeDownloadModal();
        });

        // ===== 反馈功能 =====
        function openFeedback(gameTitle) {
            currentFeedbackGame = gameTitle;
            document.getElementById('feedbackGame').textContent = gameTitle;
            document.getElementById('feedbackModal').classList.add('active');
        }

        function closeFeedback() {
            document.getElementById('feedbackModal').classList.remove('active');
            document.getElementById('feedbackContent').value = '';
            document.getElementById('feedbackContact').value = '';
        }

        function submitFeedback() {
            const content = document.getElementById('feedbackContent').value.trim();
            const contact = document.getElementById('feedbackContact').value.trim();
            
            if (!content) {
                alert('请描述问题内容');
                return;
            }

            // 构建邮件内容
            const subject = encodeURIComponent(`【游戏反馈】${currentFeedbackGame}`);
            const body = encodeURIComponent(
                `游戏名称：${currentFeedbackGame}\n` +
                `反馈时间：${new Date().toLocaleString('zh-CN')}\n` +
                `问题描述：${content}\n` +
                `联系方式：${contact || '未填写'}`
            );

            // 打开邮件客户端
            window.location.href = `mailto:${CONFIG.feedbackEmail}?subject=${subject}&body=${body}`;
            
            alert('邮件已打开，请发送邮件反馈问题！');
            closeFeedback();
        }

        // 点击弹窗外部关闭反馈弹窗
        document.getElementById('feedbackModal').addEventListener('click', (e) => {
            if (e.target.id === 'feedbackModal') closeFeedback();
        });

        // ===== 打赏功能 =====
        function openDonateModal() {
            // 更新收款码图片链接
            document.querySelector('#donateModal .donate-code-item:nth-child(1) img').src = CONFIG.wechatQR;
            document.querySelector('#donateModal .donate-code-item:nth-child(2) img').src = CONFIG.alipayQR;
            document.getElementById('donateModal').classList.add('active');
        }

        function closeDonateModal() {
            document.getElementById('donateModal').classList.remove('active');
        }

        // 点击弹窗外部关闭打赏弹窗
        document.getElementById('donateModal').addEventListener('click', (e) => {
            if (e.target.id === 'donateModal') closeDonateModal();
        });

        // 初始化
        createStars();
        loadGames();
    </script>
</body>
</html>
